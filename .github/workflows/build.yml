name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.2 (matched to AGP 8.2.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias screendetect \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass screendetect -keypass screendetect \
            -dname "CN=ScreenDetect, OU=Dev, O=Dev, L=Nanning, ST=Guangxi, C=CN"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
